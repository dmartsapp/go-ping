name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-and-vuln-check:
    name: Lint and Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run linting
        uses: reviewdog/action-golangci-lint@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: error
          level: info

      - name: Run vulnerability check
        uses: golang/govulncheck-action@v1

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint-and-vuln-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test ./... -race -v

  cross-compile:
    name: Cross-compile check
    runs-on: ubuntu-latest
    needs: lint-and-vuln-check
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows, freebsd, openbsd, netbsd, solaris, android]
        goarch: [amd64, arm64]
        exclude:
          - goos: solaris
            goarch: arm64
          - goos: android
            goarch: amd64
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build every package for ${{ matrix.goos }}/${{ matrix.goarch }}
        run: go build ./...
